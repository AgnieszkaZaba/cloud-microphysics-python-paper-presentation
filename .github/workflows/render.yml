name: render

defaults:
  run:
    shell: bash -ex {0}

on:
  push:
    branches: [ main ]
    paths-ignore:
      - README.md
  pull_request:
    branches: [ main ]
    paths-ignore:
      - README.md

jobs:
  render:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install Python deps
        shell: bash
        run: |
          python -m pip install matplotlib mendeleev pyyaml numpy numba ipykernel nbformat nbconvert scipy pint
      - uses: quarto-dev/quarto-actions/setup@v2
      - if: runner.os == 'Windows'
        shell: bash
        run: echo "QUARTO_PYTHON=python" >> $GITHUB_ENV
      - run: quarto render slides.qmd --to revealjs

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: slides
          path: slides.html


      - name: Install browser and GIF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Render Reveal.js presentation
        run: quarto render slides.qmd

      - name: Capture slides and create GIF
        run: python scripts/slides_to_gif.py slides.html slides.gif

      - name: Upload GIF artifact
        uses: actions/upload-artifact@v4
        with:
          name: quarto-slides-gif
          path: slides.gif
          if-no-files-found: error
          retention-days: 14